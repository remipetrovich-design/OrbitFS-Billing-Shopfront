name: Fallback Billing Public Domain Smoke
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/fallback-billing-domain-smoke.yml
permissions:
  contents: read
jobs:
  smoke:
    if: github.repository == 'remipetrovich-design/OrbitFS-Billing-Shopfront'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Test TLS and HTTP without bypassing certificate verification
        shell: bash
        run: |
          set -euo pipefail
          url='https://billing.incendiarynetworks.cc/'
          for attempt in 1 2 3 4 5; do
            if curl --fail-with-body --silent --show-error --location --max-time 20 --output /tmp/billing-home.html --write-out 'Billing HTTP %{http_code}, TLS verified %{ssl_verify_result}, IP %{remote_ip}\n' "$url"; then
              echo 'Billing HTTPS GET passed using trusted certificate'
              break
            fi
            if [ "$attempt" -eq 5 ]; then echo '::error::Billing public URL failed'; exit 1; fi
            sleep 6
          done
          test -s /tmp/billing-home.html
      - name: Install Playwright browser
        run: |
          mkdir /tmp/orbitfs-billing-browser
          cd /tmp/orbitfs-billing-browser
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium >/dev/null
      - name: Render actual Billing storefront on mobile Chromium
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/orbitfs-billing-browser
          node - <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try{
              const page=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:1});
              const errors=[];
              page.on('pageerror',error=>errors.push(String(error?.message||error).slice(0,160)));
              const response=await page.goto('https://billing.incendiarynetworks.cc/',{waitUntil:'domcontentloaded',timeout:45000});
              await page.waitForTimeout(3500);
              const text=(await page.locator('body').innerText()).slice(0,600);
              console.log('HTTP status',response?.status());
              console.log('Final URL',page.url());
              console.log('Browser title',await page.title());
              console.log('Body length',text.length);
              console.log('Page JavaScript errors',JSON.stringify(errors));
              console.log('Body excerpt',text.replace(/\\s+/g,' ').slice(0,240));
              await page.screenshot({path:'/tmp/orbitfs-billing-browser.png',fullPage:true});
              if(response?.status()!==200)throw Error('Billing storefront returned HTTP '+response?.status());
              if(!text||text.includes('This site can\'t be reached')||text.includes('Application error'))throw Error('Billing storefront not rendering');
              if(errors.length)throw Error('Billing JavaScript browser errors: '+JSON.stringify(errors));
              console.log('BILLING LIVE BROWSER SMOKE PASSED');
            } finally {await browser.close();}
          })().catch(error=>{console.error('BILLING TEST FAILED:',error.message);process.exitCode=1;});
          NODE
      - name: Archive screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: billing-domain-live-browser
          path: /tmp/orbitfs-billing-browser.png
          if-no-files-found: ignore
