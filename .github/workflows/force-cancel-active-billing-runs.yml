name: Force cancel active Billing runs

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/force-cancel-active-billing-runs.yml

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Force cancel every other active workflow run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$REPOSITORY"
          runs="$(curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$api/actions/runs?per_page=100")"
          ids="$(printf '%s' "$runs" | jq -r --arg current "$CURRENT_RUN_ID" '.workflow_runs[] | select((.status != "completed") and ((.id|tostring) != $current)) | .id')"
          [ -n "$ids" ] || { echo "No other active workflow runs."; exit 0; }
          while IFS= read -r id; do
            [ -n "$id" ] || continue
            echo "Force cancelling run $id"
            curl --silent --show-error --output /tmp/force-cancel.txt --write-out '%{http_code}' -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$api/actions/runs/$id/force-cancel"
            echo
          done <<< "$ids"
