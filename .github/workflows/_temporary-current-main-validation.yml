name: Temporary Current Main Validation

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: temporary-current-main-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://ci-placeholder.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_ci_placeholder' }}
    steps:
      - name: Check active GitHub profile
        shell: bash
        env:
          EXPECTED_GITHUB_PROFILE: fallback
        run: |
          set -euo pipefail
          profile_file="$(mktemp)"
          trap 'rm -f "$profile_file"' EXIT
          status="$(curl --silent --show-error --retry 2 --retry-delay 2 --output "$profile_file" --write-out '%{http_code}' https://incendiarynetworks.cc/api/v1/github-profile || true)"
          case "$status" in
            200)
              response="$(cat "$profile_file")"
              active="$(node -e 'const x=JSON.parse(process.argv[1]); process.stdout.write(String(x.profile||""))' "$response")"
              ;;
            404)
              active="fallback"
              echo "License Manager source-mode endpoint is not deployed yet; using the migration bootstrap default: fallback."
              ;;
            *)
              echo "::error::License Manager source-mode check failed (HTTP $status)."
              cat "$profile_file"
              exit 1
              ;;
          esac
          echo "Active GitHub profile: $active"
          echo "Expected for this repository: $EXPECTED_GITHUB_PROFILE"
          test "$active" = "$EXPECTED_GITHUB_PROFILE"
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
